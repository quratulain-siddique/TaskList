<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=overlays-content" />
  <meta name="theme-color" content="#f1a820" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tasks" />
  <meta name="description" content="Personal task list — free, offline, file-backed" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
  <title>Tasks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-bar">
    <button type="button" class="icon-btn" id="btn-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <h1 class="app-title">Tasks</h1>
    <div class="app-actions">
      <button type="button" class="icon-btn" id="btn-add" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-search" aria-label="Search">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-more" aria-label="More">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  </header>

  <div class="search-bar" id="search-bar" hidden>
    <input type="search" id="search-input" placeholder="Search tasks…" autocomplete="off" />
    <button type="button" class="text-btn" id="btn-search-close">Cancel</button>
  </div>

  <div class="task-area" id="task-area">
    <main class="task-list" id="task-list" aria-live="polite"></main>
    <p class="empty-state" id="empty-state" hidden>No tasks yet. Tap + to add one.</p>
    <div class="loading-overlay" id="loading-overlay" hidden>
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text">Loading tasks…</p>
    </div>
  </div>

  <button type="button" class="fab" id="btn-add-fab" aria-label="Add task">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>

  <!-- Side drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-header">
      <span class="drawer-brand">My Tasks</span>
      <p class="drawer-sub" id="drawer-sub">Guest — stored on this device</p>
    </div>
    <nav class="drawer-nav">
      <section class="drawer-section" id="drawer-sync">
        <h2 class="drawer-section-title">Sync</h2>
        <button type="button" class="drawer-item drawer-subitem" id="btn-sign-in">Sign in / Sign up</button>
        <button type="button" class="drawer-item drawer-subitem" id="btn-sign-out" hidden>Sign out</button>
      </section>
      <section class="drawer-section">
        <div class="drawer-section-head">
          <h2 class="drawer-section-title">Lists</h2>
          <button type="button" class="drawer-add-btn" id="btn-add-list" aria-label="Add list" title="Add list">+</button>
        </div>
        <div id="drawer-lists"></div>
      </section>
    </nav>
  </aside>

  <!-- More menu -->
  <div class="menu-backdrop" id="menu-backdrop" hidden></div>
  <div class="overflow-menu" id="overflow-menu" hidden role="menu">
    <button type="button" role="menuitem" id="menu-clear-done">Clear completed</button>
  </div>

  <!-- Add / Edit task — full screen -->
  <dialog class="task-editor" id="task-dialog">
    <form id="task-form" class="task-editor-form">
      <header class="task-editor-bar">
        <button type="button" class="icon-btn" id="btn-dialog-close" aria-label="Back">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h2 id="dialog-title" class="task-editor-title">New Task</h2>
        <button type="button" class="icon-btn" id="btn-dialog-delete" hidden aria-label="Delete">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
        <span class="task-editor-bar-spacer" id="btn-dialog-delete-spacer"></span>
      </header>

      <div class="task-editor-body">
        <div class="title-field-wrap">
          <span class="title-field-label">What needs to be done?</span>
          <textarea id="field-title" required maxlength="300" rows="1" placeholder="Task title"></textarea>
        </div>

        <section class="editor-section">
          <h3 class="editor-section-label">Subtasks</h3>
          <ul class="subtask-list" id="subtask-list"></ul>
          <p class="subtasks-empty" id="subtasks-empty">No sub tasks yet.</p>
          <button type="button" class="editor-link-btn" id="btn-add-subtask">
            <span class="editor-link-plus">+</span> Add subtask
          </button>
        </section>

        <section class="editor-section">
          <h3 class="editor-section-label">Due date</h3>
          <label class="editor-field-row">
            <span class="editor-field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
            </span>
            <input type="date" id="field-date" />
          </label>
          <label class="editor-field-row">
            <span class="editor-field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
            </span>
            <input type="time" id="field-time" />
          </label>
          <button type="button" class="btn-plus-7days" id="btn-plus-7days" title="Set due date 7 days ahead and save">+7 days</button>
        </section>
      </div>

      <button type="submit" class="fab fab-save" id="btn-dialog-save" aria-label="Save task">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </button>
      <input type="hidden" id="field-id" />
    </form>
  </dialog>

  <!-- New list dialog -->
  <dialog class="sheet" id="list-dialog">
    <form id="list-form">
      <h2>New list</h2>
      <label>
        Name
        <input type="text" id="list-name" required maxlength="60" autocomplete="off" placeholder="e.g. Shopping, Work" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" id="btn-list-cancel">Cancel</button>
        <button type="submit" class="btn-primary" id="btn-list-create">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Auth dialog -->
  <dialog class="sheet" id="auth-dialog">
    <form id="auth-form">
      <h2 id="auth-dialog-title">Sign in</h2>
      <p class="auth-hint" id="auth-hint">Use the same email on any device to sync your tasks.</p>
      <label>
        Email
        <input type="email" id="auth-email" required autocomplete="email" placeholder="you@example.com" />
      </label>
      <label class="password-field">
        Password
        <span class="password-input-wrap">
          <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters" />
          <button type="button" class="password-toggle" id="btn-password-toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </span>
      </label>
      <p class="auth-error" id="auth-error" hidden></p>
      <div class="dialog-actions auth-actions">
        <button type="button" class="btn-ghost" id="btn-auth-cancel">Cancel</button>
        <button type="button" class="btn-ghost" id="btn-auth-switch">Sign up</button>
        <button type="submit" class="btn-primary" id="btn-auth-submit">Sign in</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
